spring.application.name=image2playlist
app.ocr.tessdata-path=${TESSDATA_PATH:C:/Program Files/Tesseract-OCR/tessdata}
app.apple-music.developer-token=${APPLE_MUSIC_DEVELOPER_TOKEN:}
app.apple-music.storefront=${APPLE_MUSIC_STOREFRONT:us}
app.web.allowed-origin=${FRONTEND_ORIGIN:http://127.0.0.1:5173}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/image2playlist}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
